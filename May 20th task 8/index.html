<!DOCTYPE html>
<html>
<head>
  <title>Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Products</h2>
<div class="cart-bar">Cart: <span id="cartCount">0</span> | Total: $<span id="total">0</span></div>

<div class="controls">
  <input type="text" id="search" placeholder="Search products...">
  <button class="cat-btn active" data-cat="all">All</button>
  <button class="cat-btn" data-cat="electronics">Electronics</button>
  <button class="cat-btn" data-cat="jewelery">Jewelery</button>
  <button class="cat-btn" data-cat="men's clothing">Men's Clothing</button>
  <button class="cat-btn" data-cat="women's clothing">Women's Clothing</button>
</div>

<div id="loading">Loading...</div>
<div id="error">Error Fetching Data</div>
<div class="products" id="products"></div>

<script src="script.js"></script>
</body>
</html>
